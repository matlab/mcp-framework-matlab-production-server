name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Toolbox version (major.minor.patch) for a test build
        default: 0.0.0

# This file runs in two repositories. On the internal repository
# (github.mathworks.com) every job except package-toolbox runs; on the public
# repository (github.com) only package-toolbox runs. All testing happens
# internally, before the code is mirrored to the public repository.

# win64 is temporarily disabled (temp-dir issue: spaces in path). To re-enable,
# add a win64 job on runner [self-hosted, hasSFSAccess, win64] with matlab-path
# \\mathworks\devel\bat\Bps\perfect\matlab.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    if: github.server_url != 'https://github.com' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, glnxa64]
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Detect code vs docs-only changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CHANGED" | grep -qE '^[+]prodserver/|^server/|^src/|^Test/|^Examples/|^Utilities/|^\.github/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, hasSFSAccess, glnxa64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Add MATLAB to PATH
        uses: ./.github/actions/setup-matlab-path
      - name: Run unit tests
        uses: mw-actions/matlab-actions-run-tests@v3
        with:
          source-folder: .
          select-by-folder: Test/unit
          test-results-junit: test-results/unit.xml
          code-coverage-cobertura: coverage-results/unit/coverage.xml
          code-coverage-html: coverage-results/unit/html
          generate-summary: true
      - name: Post coverage summary
        if: always()
        run: |
          rate=$(grep -oP 'line-rate="\K[^"]+' coverage-results/unit/coverage.xml | head -1)
          pct=$(echo "$rate * 100" | bc -l | xargs printf "%.1f")
          echo "### Unit Line Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **unit-coverage** artifact for the full HTML report." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results-glnxa64
          path: test-results/
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-coverage
          path: coverage-results/unit/

  go-tests:
    name: Go Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, glnxa64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Check Go availability
        id: go-check
        run: |
          if go version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Go
        if: steps.go-check.outputs.available != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache-dependency-path: src/*/go.sum
      - name: Run yaml2json tests
        working-directory: src/yaml2json
        env:
          MW_ARCH: glnxa64
        run: |
          mkdir -p ../../bin/glnxa64/yaml2json
          go build -o ../../bin/glnxa64/yaml2json/yaml2json .
          go test ./...
      - name: Run persist/file tests
        working-directory: src/persist/file
        env:
          MW_ARCH: glnxa64
          MW_INSTALL: ${{ github.workspace }}
        run: |
          mkdir -p ${{ github.workspace }}/bin/glnxa64/toolbox/stats/pipeline/data/persist
          go build -o ${{ github.workspace }}/bin/glnxa64/toolbox/stats/pipeline/data/persist/file_persist .
          go test ./...

  integration-tests:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, hasSFSAccess, glnxa64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Add MATLAB to PATH
        uses: ./.github/actions/setup-matlab-path
      - name: Run integration tests (build + client)
        uses: mw-actions/matlab-actions-run-tests@v3
        with:
          source-folder: .
          select-by-folder: Test/integration/build;Test/integration/client
          test-results-junit: test-results/integration.xml
          code-coverage-cobertura: coverage-results/integration/coverage.xml
          code-coverage-html: coverage-results/integration/html
          generate-summary: true
      - name: Post coverage summary
        if: always()
        run: |
          rate=$(grep -oP 'line-rate="\K[^"]+' coverage-results/integration/coverage.xml | head -1)
          pct=$(echo "$rate * 100" | bc -l | xargs printf "%.1f")
          echo "### Integration Line Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **integration-coverage** artifact for the full HTML report." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results-glnxa64
          path: test-results/
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-coverage
          path: coverage-results/integration/

  check-skill-sync:
    name: Check Skill Sync
    runs-on: [self-hosted, glnxa64]
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.server_url != 'https://github.com'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Verify skill files are in sync
        run: |
          diff .claude/skills/mps-mcp-build/SKILL.md skills-catalog/mcp-framework/mps-mcp-build/SKILL.md || {
            echo "::error::mps-mcp-build SKILL.md copies have diverged. Edit one and copy to the other."
            exit 1
          }

  example-tests:
    name: Example Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, hasSFSAccess, glnxa64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Add MATLAB to PATH
        uses: ./.github/actions/setup-matlab-path
      - name: Start MPS and run example tests
        uses: mw-actions/matlab-actions-run-command@v3
        with:
          command: addpath(pwd); addpath('.github/workflows/scripts'); [c1,c2,mps] = startMPS(); runTests('examples', 'test-results/examples.xml', [], mps)
      - name: Upload example test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: example-test-results-glnxa64
          path: test-results/

  e2e-tests:
    name: End-to-End Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, hasSFSAccess, glnxa64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Add MATLAB to PATH
        uses: ./.github/actions/setup-matlab-path
      - name: Start MPS and run end-to-end tests
        uses: mw-actions/matlab-actions-run-command@v3
        with:
          command: addpath(pwd); addpath('.github/workflows/scripts'); [c1,c2,mps] = startMPS(); runTests('integration', 'test-results/call.xml', ["call"], mps)
      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results-glnxa64
          path: test-results/

  ci-status:
    name: CI Status
    if: always() && github.server_url != 'https://github.com' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [changes, unit-tests, go-tests, integration-tests, example-tests, e2e-tests]
    runs-on: [self-hosted, glnxa64]
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only PR — tests skipped."
            exit 0
          fi
          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.go-tests.result }}" = "failure" ] || \
             [ "${{ needs.integration-tests.result }}" = "failure" ] || \
             [ "${{ needs.example-tests.result }}" = "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" = "failure" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All tests passed."

  # Public repository only. A v* tag builds the toolbox and attaches it to a
  # draft release, which File Exchange then offers instead of the zip once the
  # release is published. A manual run (workflow_dispatch) builds the toolbox
  # and keeps it as a workflow artifact, without making a release.
  package-toolbox:
    name: Package Toolbox
    if: >-
      github.server_url == 'https://github.com' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MLTBX_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Build toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: |
            disp(version)
            which matlab.addons.toolbox.packageToolbox
            root = string(pwd);
            opts = matlab.addons.toolbox.ToolboxOptions(root, "0529396a-2937-4614-935f-6e6effe8a461");
            opts.ToolboxName = "MCP Framework for MATLAB Production Server";
            opts.PackageName = "mcp_production_server";
            opts.ToolboxVersion = erase(string(getenv("MLTBX_VERSION")), textBoundary("start") + "v");
            opts.Summary = "Publish MATLAB functions as MCP tools for AI agents using MATLAB Production Server";
            opts.AuthorName = "MathWorks MATLAB Production Server Team";
            opts.AuthorCompany = "MathWorks";
            opts.Readme = fullfile(root, "README.md");
            opts.MinimumMatlabRelease = "R2025b";
            dropFolders = fullfile(root, [".git", ".github", ".claude", ".claude-plugin", "Test"]) + filesep;
            dropFiles = fullfile(root, [".copyright-ignore", ".gitattributes", ".gitignore"]);
            files = string(opts.ToolboxFiles);
            opts.ToolboxFiles = files(~startsWith(files, dropFolders) & ~ismember(files, dropFiles));
            opts.ToolboxMatlabPath = [root, fullfile(root, "server", "tools")];
            opts.OutputFile = fullfile(root, "mcp_production_server.mltbx");
            matlab.addons.toolbox.packageToolbox(opts);
      - name: Keep toolbox as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp_production_server-mltbx
          path: mcp_production_server.mltbx
      - name: Attach toolbox to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mcp_production_server.mltbx \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
