name: Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to check'
        required: true
        type: number

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: [self-hosted, runner-source=AWS]
    steps:
      - name: Checkout reviews branch
        uses: actions/checkout@v3
        with:
          ref: reviews
          sparse-checkout: reviews
          sparse-checkout-cone-mode: true

      - name: Check for review and response
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR=${{ inputs.pr_number }}
          else
            PR=${{ github.event.pull_request.number }}
          fi
          REVIEW_FILE="reviews/PR-${PR}.md"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "::error::Review file ${REVIEW_FILE} not found on 'reviews' branch."
            exit 1
          fi

          if ! grep -q "^## Claude Code Review" "$REVIEW_FILE"; then
            echo "::error::Missing '## Claude Code Review' section in ${REVIEW_FILE}."
            exit 1
          fi

          if ! grep -q "^## Review Response" "$REVIEW_FILE"; then
            echo "::error::Missing '## Review Response' section in ${REVIEW_FILE}."
            exit 1
          fi

          # Extract content after the first "## Review Response" up to the next heading or separator
          RESPONSE=$(sed -n '/^## Review Response/{n; :loop; /^## \|^---$/q; p; n; b loop}' "$REVIEW_FILE" \
            | sed 's/<!--.*-->//g' \
            | sed '/^[[:space:]]*$/d')

          if [ -z "$RESPONSE" ]; then
            echo "::error::Review Response section in ${REVIEW_FILE} is empty or contains only placeholder text. Please add a substantive response."
            exit 1
          fi

          echo "Review gate passed."
