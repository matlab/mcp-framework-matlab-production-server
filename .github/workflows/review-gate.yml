name: Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to check'
        required: true
        type: number

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: [self-hosted, runner-source=AWS]
    steps:
      - name: Checkout reviews branch
        uses: actions/checkout@v3
        with:
          ref: reviews
          sparse-checkout: reviews
          sparse-checkout-cone-mode: true

      - name: Checkout PR head for change detection
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr-head

      - name: Check for code changes
        id: detect
        if: github.event_name == 'pull_request'
        run: |
          cd pr-head
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CHANGED" | grep -qE '^[+]prodserver/|^server/|^src/|^Test/|^Examples/|^Utilities/|^\.github/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip review for docs-only PR
        if: github.event_name == 'pull_request' && steps.detect.outputs.code != 'true'
        run: echo "Docs-only PR — review gate skipped."

      - name: Check for review and response
        if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.code == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR=${{ inputs.pr_number }}
          else
            PR=${{ github.event.pull_request.number }}
          fi
          REVIEW_FILE="reviews/PR-${PR}.md"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "::error::Review file ${REVIEW_FILE} not found on 'reviews' branch."
            exit 1
          fi

          if ! grep -q "^## Claude Code Review" "$REVIEW_FILE"; then
            echo "::error::Missing '## Claude Code Review' section in ${REVIEW_FILE}."
            exit 1
          fi

          if ! grep -q "^## Review Response" "$REVIEW_FILE"; then
            echo "::error::Missing '## Review Response' section in ${REVIEW_FILE}."
            exit 1
          fi

          # Extract content after the first "## Review Response" up to the next heading or separator
          RESPONSE=$(sed -n '/^## Review Response/{n; :loop; /^## \|^---$/q; p; n; b loop}' "$REVIEW_FILE" \
            | sed 's/<!--.*-->//g' \
            | sed '/^[[:space:]]*$/d')

          if [ -z "$RESPONSE" ]; then
            echo "::error::Review Response section in ${REVIEW_FILE} is empty or contains only placeholder text. Please add a substantive response."
            exit 1
          fi

          echo "Review gate passed."
